services:
  # Supporting services only. PostgreSQL/Auth/Realtime/Storage are provided by
  # the pinned self-hosted Supabase stack under infra/supabase.
  redis:
    image: redis:7-alpine
    container_name: hims-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Orthanc PACS & DICOM Server (for Radiology & Modality testing)
  orthanc:
    image: orthancteam/orthanc:24.12.0
    container_name: hims-orthanc
    restart: unless-stopped
    environment:
      ORTHANC_NAME: HIMS_PACS
      ORTHANC_STORAGE: /var/lib/orthanc/db
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  # Gotenberg (PDF rendering engine for clinical reports, discharge packets, and invoices)
  gotenberg:
    image: gotenberg/gotenberg:8.17.3
    container_name: hims-gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"

  # Mailpit (safe local SMTP testing & email preview)
  mailpit:
    image: axllent/mailpit:v1.23
    container_name: hims-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ClamAV (malware and antivirus scanner for clinical document uploads)
  clamav:
    image: clamav/clamav:latest
    container_name: hims-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  # OpenSearch (optional local search engine)
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: hims-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  redis-data:
  orthanc-data:
  opensearch-data:

networks:
  default:
    name: hims-network
